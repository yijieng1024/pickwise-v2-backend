name: Build and Deploy

on:
  # Manual trigger: `.github/**` is in paths-ignore below, so a change to this
  # file cannot trigger its own run — and a transient cache/registry failure
  # needs a way to be retried without an unrelated commit.
  workflow_dispatch:

  push:
    branches: [main]

    paths-ignore:
      - .github/workflows/deploy.yml
      - CLAUDE.md
      - .github/**
      - README.md
      - Progress.md
      - eval/runs
      - docs/**

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          # Cache lives in GHCR, not the Actions cache service. The Chromium
          # layer is ~600 MB, and pushing that to type=gha took 120s per run
          # and returned an HTML 504 often enough to fail the job — which
          # blocked the deploy below even though the image had already pushed.
          # GHCR has no 10 GB cache quota and we are already authenticated to it.
          # ignore-error keeps a cache hiccup from ever failing a good build.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max,ignore-error=true

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy
        run: |
          curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
