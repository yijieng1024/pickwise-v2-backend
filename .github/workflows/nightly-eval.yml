name: Nightly agent eval

# THIS MUST NEVER BE A REQUIRED CHECK.
#
# run_eval.py takes 20-30 minutes and has measured variance of about one item
# in six -- roughly 17 percentage points between identical runs. A check that
# goes red at random gets ignored, and an ignored check is worse than no check,
# because it still costs the minutes and it teaches people to click past red.
#
# So it runs on a schedule, writes its results to an artifact, and gates
# nothing. The pass rate is tracked over time by comparing artifacts, which is
# what `run_eval.py compare` is for.

on:
  schedule:
    # 02:00 UTC = 10:00 MYT, after the free-tier quota day rolls over.
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    # 30 min of work; the cap is generous because a rate-limited run backs off
    # rather than failing, and a killed run produces no artifact at all.
    timeout-minutes: 60

    # Shares the database with the CI integration job: search_laptops runs the
    # real retrieval pipeline and writes pipeline_eval_logs. It must not be
    # mid-flight while that job is dropping the schema.
    concurrency:
      group: integration-test-database
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Run the eval
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
          PRODUCTION_DB_REF: ${{ secrets.PRODUCTION_DB_REF }}
        run: |
          # 7 RPM, not the default 15: the binding free-tier limit is the
          # 16,000 input-TPM cap, not the request cap. Judge prompts carry up
          # to ~27k chars of tool output, so a faster run 429s on the
          # high-context tool_routing cases -- which is what contaminated the
          # 2026-07-18 baseline with 1 failed and 3 unscored entries.
          python eval/run_eval.py run --label ci-nightly --rpm 7

      - name: Upload results
        # Always: a partial run is still evidence, and a failed run's artifact
        # is the only way to see WHY without re-spending 30 minutes of quota.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-${{ github.run_number }}
          path: |
            eval/runs/
            logs/eval/
          retention-days: 90
