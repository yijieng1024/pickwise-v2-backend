[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# --strict-markers: a typo'd marker becomes an error instead of being ignored.
# -ra: show a summary of everything that was not a plain pass, including xfail
#      and xpass. Without this, an xpass (a known gap that has quietly been
#      fixed) is invisible and the stale marker never gets removed.
addopts =
    --strict-markers
    --strict-config
    -ra

markers =
    unit: no database, no network, no API key. ~1.5s for the whole tier.
    integration: needs a Postgres with pgvector. ~5 min against the hosted test
        project (Supabase session pooler), a few seconds against a local
        container. CI MUST NOT PUT THESE TWO IN ONE JOB -- the unit tier's
        sub-two-second feedback is its entire value, and sharing a job drags it
        to five minutes. Separate jobs, both on the pull request.
    llm: calls a real model. NOT in the gate — nightly only.
    slow: over a second.

filterwarnings =
    error::DeprecationWarning:app.*
    # ONE known exception, not a loosening of the rule above. app/main.py uses
    # @app.on_event("startup"), which FastAPI has deprecated in favour of
    # `lifespan`. It is a reported finding, left unfixed deliberately because
    # the migration changes startup ordering. Tier 4 imports app.main to build
    # its TestClient, so without this the whole tier errors at collection.
    # Matched on the exact message: any OTHER deprecation in app code still
    # fails the run, which is the point of the line above. Delete this line
    # when main.py moves to lifespan.
    ignore:\s*on_event is deprecated:DeprecationWarning
