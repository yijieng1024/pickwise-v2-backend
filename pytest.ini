[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# --strict-markers: a typo'd marker becomes an error instead of being ignored.
# -ra: show a summary of everything that was not a plain pass, including xfail
#      and xpass. Without this, an xpass (a known gap that has quietly been
#      fixed) is invisible and the stale marker never gets removed.
addopts =
    --strict-markers
    --strict-config
    -ra

markers =
    unit: no database, no network, no API key. Runs in the pull-request gate.
    integration: needs a Postgres with pgvector. Runs in the pull-request gate.
    llm: calls a real model. NOT in the gate — nightly only.
    slow: over a second.

filterwarnings =
    error::DeprecationWarning:app.*
