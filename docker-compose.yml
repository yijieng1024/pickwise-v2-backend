version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: pickwise_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: pickwise_v2
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data